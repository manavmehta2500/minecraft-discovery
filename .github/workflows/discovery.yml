name: Discovery Worker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "parser/**"
      - "publisher/**"
      - "loop.py"
      - "config.py"
      - "requirements.txt"
      - ".github/workflows/discovery.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "discovery"
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data dir exists
        run: |
          mkdir -p data
          [ -f data/mods.json ] || echo '[]' > data/mods.json
          [ -f data/locks.json ] || echo '{}' > data/locks.json
          touch .nojekyll

      - name: Run discovery cycle
        env:
          STORAGE_BACKEND: "local"
          DISCOVERY_MODE: ${{ vars.DISCOVERY_MODE || 'FAST' }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS || '500' }}
          REQUEST_DELAY: "1.0"
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python loop.py --once

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mods.json data/locks.json .nojekyll
          if git diff --cached --quiet; then
            echo "No new mods this cycle."
          else
            git commit -m "chore(data): auto-update discovered mods"
            git push
          fi

  deploy-pages:
    needs: discover
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (post-discovery, fresh data)
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4